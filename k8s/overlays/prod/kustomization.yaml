apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: mon-app-prod

# Plus de réplicas pour la production
replicas:
  - name: fastapi
    count: 3
  - name: redis
    count: 2

# On utilise un tag de version stable (ex: v1.0.0)
images:
  - name: ahmedfanidi/fastapi-demo
    newTag: v1.0.0
