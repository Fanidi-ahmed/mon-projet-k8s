apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# On pointe vers la base
resources:
  - ../../base

# On définit le namespace cible
namespace: mon-app

# On modifie les réplicas pour le dev (1 seul)
replicas:
  - name: fastapi
    count: 1
  - name: redis
    count: 1

# On peut aussi changer le tag de l'image pour le dev
images:
  - name: ahmedfanidi/fastapi-demo
    newTag: latest
