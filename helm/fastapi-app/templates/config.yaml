apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace }}
data:
  REDIS_HOST: "{{ .Release.Name }}-redis-headless"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  REDIS_PASSWORD: {{ .Values.redisPassword | b64enc | quote }}
